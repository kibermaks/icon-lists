name: Daily metadata refresh and CDN warmup
on:
  schedule:
    - cron:  '5 0 * * *'   # 00:05 UTC every day
    - cron:  '15 0 * * *'  # 00:15 UTC every day (CDN warmup, 10 min after build)
  workflow_dispatch:

jobs:
  build:
    name: Update icon metadata
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npm ci
      - name: Clone lucide-icons repo
        run: |
          git clone https://github.com/lucide-icons/lucide.git
      - name: Perform custom update script
        run: |
          node src/update.js
      # Commit only if files changed
      - name: Push changes if needed
        id: push_changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: daily icon metadata refresh'
          branch: gh-pages
          create_branch: true
          push_options: --force
      - name: Purge jsDelivr for all dist assets
        if: steps.push_changes.outputs.changes_detected == 'true'
        run: |
          curl -sS "https://purge.jsdelivr.net/gh/${{ github.repository }}@gh-pages/dist"

  cdn-warmup:
    name: Warm up CDN cache
    runs-on: ubuntu-latest
    steps:
      - name: Warm up CDN cache
        run: |
          # CDN base URL and data revision
          CDN_BASE_URL="https://cdn.jsdelivr.net/gh/kibermaks/icon-lists@gh-pages/dist/"
          DATA_REVISION="2025-08-12"
          
          # Calculate day for cache-busting (changes every 24 hours)
          DAY=$(expr $(date +%s) / 86400)
          
          # Icon set files to warm up
          FILES=(
            "material-combined.min.json"
            "material-combined-full.min.json"
            "material-icons.min.json"
            "material-icons-full.min.json"
            "material-symbols.min.json"
            "material-symbols-full.min.json"
            "lucide-icons.min.json"
            "lucide-icons-full.min.json"
            "phosphor-icons.min.json"
            "phosphor-icons-full.min.json"
            "ultimate-icons.min.json"
            "ultimate-icons-full.min.json"
          )
          
          echo "Warming up CDN cache for ${#FILES[@]} files..."
          
          for file in "${FILES[@]}"; do
            URL="${CDN_BASE_URL}${file}?v=${DAY}&r=${DATA_REVISION}"
            echo "Requesting: $URL"
            curl -sS "$URL" > /dev/null
          done
          
          echo "CDN warmup complete!"
