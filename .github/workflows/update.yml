name: Daily metadata refresh and CDN warmup
on:
  schedule:
    - cron:  '5 0 * * *'   # 00:05 UTC every day
    - cron:  '15 0 * * *'  # 00:15 UTC every day (CDN warmup, 10 min after build)
  workflow_dispatch:

jobs:
  build:
    name: Update icon metadata
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npm ci
      - name: Clone lucide-icons repo
        run: |
          git clone https://github.com/lucide-icons/lucide.git
      - name: Perform custom update script
        run: |
          node src/update.js
      # dist/ is in .gitignore (for main branch), but gh-pages needs it
      - name: Push to gh-pages
        id: push_changes
        run: |
          # Remove /dist from .gitignore so git sees the built files
          sed -i '/^\/dist$/d' .gitignore
          git add -A
          if git diff --cached --quiet HEAD; then
            echo "No changes detected"
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: daily icon metadata refresh"
            git push --force origin HEAD:gh-pages
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Purge jsDelivr cache for each dist file
        if: steps.push_changes.outputs.changes_detected == 'true'
        run: |
          REPO="${{ github.repository }}"
          FILES=(
            material-combined.min.json material-combined-full.min.json
            material-icons.min.json material-icons-full.min.json
            material-symbols.min.json material-symbols-full.min.json
            lucide-icons.min.json lucide-icons-full.min.json
            phosphor-icons.min.json phosphor-icons-full.min.json
            ultimate-icons.min.json ultimate-icons-full.min.json
          )
          for f in "${FILES[@]}"; do
            echo "Purging $f..."
            curl -sS "https://purge.jsdelivr.net/gh/${REPO}@gh-pages/dist/${f}" | grep -o '"status":"[^"]*"' || true
          done

  cdn-warmup:
    name: Warm up CDN cache
    runs-on: ubuntu-latest
    steps:
      - name: Warm up CDN cache
        run: |
          # CDN base URL and data revision
          CDN_BASE_URL="https://cdn.jsdelivr.net/gh/kibermaks/icon-lists@gh-pages/dist/"
          DATA_REVISION="2025-08-12"
          
          # Calculate day for cache-busting (changes every 24 hours)
          DAY=$(expr $(date +%s) / 86400)
          
          # Icon set files to warm up
          FILES=(
            "material-combined.min.json"
            "material-combined-full.min.json"
            "material-icons.min.json"
            "material-icons-full.min.json"
            "material-symbols.min.json"
            "material-symbols-full.min.json"
            "lucide-icons.min.json"
            "lucide-icons-full.min.json"
            "phosphor-icons.min.json"
            "phosphor-icons-full.min.json"
            "ultimate-icons.min.json"
            "ultimate-icons-full.min.json"
          )
          
          echo "Warming up CDN cache for ${#FILES[@]} files..."
          
          for file in "${FILES[@]}"; do
            URL="${CDN_BASE_URL}${file}?v=${DAY}&r=${DATA_REVISION}"
            echo "Requesting: $URL"
            curl -sS "$URL" > /dev/null
          done
          
          echo "CDN warmup complete!"
